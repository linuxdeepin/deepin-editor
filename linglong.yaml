version: "1"

package:
  id: org.deepin.editor
  name: "deepin-editor"
  version: 6.5.63.1
  kind: app
  description: |
    editor for deepin os.

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.webengine/6.7.0

command:
  - deepin-editor

build: |
  # 修改路径
  sed -i 's|set(QT_LRELEASE "/lib/qt${QT_VERSION_MAJOR}/bin/lrelease")|set(QT_LRELEASE "lrelease")|g' cmake/translation-generate.cmake

  # 构建
  # 优先从 /runtime 解析 Qt6/DTK6，避免 buildext 装入 /usr 的 qt6 开发包抢占 find_package
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build ${conf_args} \
        -DCMAKE_PREFIX_PATH=/runtime \
        -DCMAKE_SAFETYTEST_ARG="CMAKE_SAFETYTEST_ARG_OFF" \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
        -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install

# 构建期与运行期缺失依赖声明式安装，由 linglong 解析闭包：
# Qt6/DTK6/pkgconf 由 runtime 层(org.deepin.runtime.webengine)提供；
# gtest/gmock 仅 Debug 测试构建需要；polkit 源码无引用，均不声明
buildext:
  apt:
    build_depends:
      - cmake
      - libchardet-dev
      - libicu-dev
      - libkf6codecs-dev
      - libkf6syntaxhighlighting-dev
      - libuchardet-dev
    depends:
      - deepin-event-log
      - libchardet1
      - libkf6codecs6
      - libkf6syntaxhighlighting6
      - libuchardet0
