name: 编辑模式_suite
app: deepin-editor
module: 编辑模式
setup:
- action: session_start
  command: deepin-editor
  wait: 3.0
suites:
- id: suite_编辑模式_001_s1
  name: 编码切换
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+t
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: PToolButton
    items:
    - 简体中文
    - GB18030
  - step_type: action
    action: keyboard_type
    text: UOS给世界更好的选择
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: PToolButton
    items:
    - PActUtf8
  - step_type: action
    action: keyboard_press
    key: enter
  - step_type: action
    action: file_dialog_select
    path: /tmp/test_encoding_switch.txt
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_file_exists
    path: /tmp/test_encoding_switch.txt
teardown:
- action: session_stop
