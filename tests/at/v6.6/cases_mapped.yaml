# cases_mapped.yaml — V6.6 文本编辑器 AT-SPI 测试用例映射产物
# 来源：cases_standard.yaml → 语义映射（at-mapping-rules）
# manual 用例标 unsupported + reason，不生成可执行 step

metadata:
  generated_at: "2026-09-10"
  source: "文本编辑器V6.6详细需求说明书"
  module: v6.6

cases:
  # ============================================================
  # 模块一：查找结果展示索引与总数显示（8 例，7 active + 1 unsupported）
  # ============================================================

  - id: v6.6-find-001
    name: 查找匹配_显示索引与总数
    module: 查找结果索引
    status: active
    annotation:
      测试界面: 主窗口-查找栏
      测试功能: 查找结果索引与总数显示
      前置条件: 文本编辑器已启动；编辑区有包含多次出现的文本
      AT元素引用: FindInput, MatchCountLabel, TextEditor
    steps:
    - step_type: action
      description: 在文本编辑区输入包含多次出现的文本
      action: keyboard_type
      text: 'hello world hello test hello'
    - step_type: action
      description: 按 Ctrl+F 打开查找栏
      action: keyboard_hot_key
      key: ctrl+f
    - step_type: action
      description: 在查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Enter 触发查找
      action: keyboard_press
      key: enter
    - step_type: assert
      description: 验证查找结果计数标签可见
      action: assert_element
      selector:
        name: MatchCountLabel
        role: label
    - step_type: assert
      description: 验证计数标签显示第1/3项
      action: assert_ocr_exists
      text: 第1/3项

  - id: v6.6-find-002
    name: 无匹配结果_不显示计数
    module: 查找结果索引
    status: active
    annotation:
      测试界面: 主窗口-查找栏
      测试功能: 无匹配结果时不显示计数
      前置条件: 文本编辑器已启动；编辑区有文本
      AT元素引用: FindInput, MatchCountLabel, TextEditor
    steps:
    - step_type: action
      description: 在文本编辑区输入文本
      action: keyboard_type
      text: 'hello world'
    - step_type: action
      description: 按 Ctrl+F 打开查找栏
      action: keyboard_hot_key
      key: ctrl+f
    - step_type: action
      description: 在查找输入框输入不存在的词
      action: keyboard_type
      text: xyznotexist
    - step_type: action
      description: 按 Enter 触发查找
      action: keyboard_press
      key: enter
    - step_type: assert
      description: 验证计数标签不显示
      action: assert_not_exists
      selector:
        name: MatchCountLabel
        role: label

  - id: v6.6-find-003
    name: 切换下一项_索引实时更新
    module: 查找结果索引
    status: active
    annotation:
      测试界面: 主窗口-查找栏
      测试功能: 切换下一项时索引实时更新
      前置条件: 文本编辑器已启动；编辑区有多次匹配的文本
      AT元素引用: FindNext, MatchCountLabel, FindInput
    steps:
    - step_type: action
      description: 在文本编辑区输入包含多次出现的文本
      action: keyboard_type
      text: 'hello world hello test hello'
    - step_type: action
      description: 按 Ctrl+F 打开查找栏
      action: keyboard_hot_key
      key: ctrl+f
    - step_type: action
      description: 在查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Enter 触发查找
      action: keyboard_press
      key: enter
    - step_type: action
      description: 点击查找下一个按钮
      action: element_action
      selector:
        name: FindNext
        role: button
      do: click
    - step_type: assert
      description: 验证计数标签显示第2/3项
      action: assert_element
      selector:
        name: MatchCountLabel
        role: label
    - step_type: assert
      description: 验证OCR识别到第2/3项
      action: assert_ocr_exists
      text: 第2/3项

  - id: v6.6-find-004
    name: 切换上一项_索引实时更新
    module: 查找结果索引
    status: active
    annotation:
      测试界面: 主窗口-查找栏
      测试功能: 切换上一项时索引实时更新
      前置条件: 文本编辑器已启动；已执行查找并定位到第2项
      AT元素引用: FindNext, FindPrevious, MatchCountLabel
    steps:
    - step_type: action
      description: 在文本编辑区输入包含多次出现的文本
      action: keyboard_type
      text: 'hello world hello test hello'
    - step_type: action
      description: 按 Ctrl+F 打开查找栏
      action: keyboard_hot_key
      key: ctrl+f
    - step_type: action
      description: 在查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Enter 触发查找
      action: keyboard_press
      key: enter
    - step_type: action
      description: 点击查找下一个按钮定位到第2项
      action: element_action
      selector:
        name: FindNext
        role: button
      do: click
    - step_type: action
      description: 点击查找上一个按钮回到第1项
      action: element_action
      selector:
        name: FindPrevious
        role: button
      do: click
    - step_type: assert
      description: 验证计数标签显示第1/3项
      action: assert_element
      selector:
        name: MatchCountLabel
        role: label
    - step_type: assert
      description: 验证OCR识别到第1/3项
      action: assert_ocr_exists
      text: 第1/3项

  - id: v6.6-find-005
    name: 编辑文本_总数实时更新
    module: 查找结果索引
    status: active
    annotation:
      测试界面: 主窗口-查找栏/编辑区
      测试功能: 编辑文本后查找总数实时更新
      前置条件: 文本编辑器已启动；已执行查找且查找栏打开
      AT元素引用: MatchCountLabel, FindInput, TextEditor
    steps:
    - step_type: action
      description: 在文本编辑区输入初始文本
      action: keyboard_type
      text: 'hello world hello'
    - step_type: action
      description: 按 Ctrl+F 打开查找栏
      action: keyboard_hot_key
      key: ctrl+f
    - step_type: action
      description: 在查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Enter 触发查找
      action: keyboard_press
      key: enter
    - step_type: action
      description: 按 Escape 关闭查找栏
      action: keyboard_press
      key: escape
    - step_type: action
      description: 全选并替换编辑区内容增加匹配数
      action: keyboard_hot_key
      key: ctrl+a
    - step_type: action
      description: 输入新文本增加匹配数
      action: keyboard_type
      text: 'hello world hello test hello hello'
    - step_type: action
      description: 按 Ctrl+F 重新打开查找栏
      action: keyboard_hot_key
      key: ctrl+f
    - step_type: action
      description: 在查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Enter 触发查找
      action: keyboard_press
      key: enter
    - step_type: assert
      description: 验证计数标签显示第1/4项
      action: assert_element
      selector:
        name: MatchCountLabel
        role: label
    - step_type: assert
      description: 验证OCR识别到第1/4项
      action: assert_ocr_exists
      text: 第1/4项

  - id: v6.6-find-006
