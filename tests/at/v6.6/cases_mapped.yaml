      description: 新建标签页
      action: keyboard_hot_key
      key: ctrl+t
    - step_type: action
      description: 点击高亮菜单切换语言
      action: element_action
      selector:
        name: HighlightMenu
      do: click
    - step_type: action
      description: 输入markdown搜索语言
      action: keyboard_type
      text: markdown
    - step_type: action
      description: 确认选择
      action: keyboard_press
      key: enter
    - step_type: action
      description: 等待实时预览激活
      action: wait
      wait: 1.0
    - step_type: assert
      description: 验证Markdown渲染视图可见
      action: assert_element
      selector:
        name: MarkdownView
        role: panel

  - id: v6.6-md-005
    name: 右键菜单_切换查看视图
