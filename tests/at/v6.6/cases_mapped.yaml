      description: 在替换查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Tab 切换到替换为输入框
      action: keyboard_press
      key: tab
    - step_type: action
      description: 在替换为输入框输入替换词
      action: keyboard_type
      text: hi
    - step_type: action
      description: 点击替换下一个按钮
      action: element_action
      selector:
        name: ReplaceNext
        role: button
      do: click
    - step_type: assert
      description: 验证计数标签显示第1/2项
      action: assert_element
      selector:
        name: MatchCountLabel
        role: label
    - step_type: assert
      description: 验证OCR识别到第1/2项
      action: assert_ocr_exists
      text: 第1/2项

  - id: v6.6-find-007
