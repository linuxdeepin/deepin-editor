  # ============================================================
  # 模块二：Markdown 文档渲染（24 例，12 active + 12 unsupported）
  # ============================================================

  - id: v6.6-md-001
    name: 新建文件_纯文本不渲染
    module: Markdown渲染
    status: active
    annotation:
      测试界面: 主窗口-编辑区
      测试功能: 新建非md文件不触发Markdown渲染
      前置条件: 文本编辑器已启动；默认新建空白文件
      AT元素引用: TextEditor
    steps:
    - step_type: action
      description: 新建标签页
      action: keyboard_hot_key
      key: ctrl+t
    - step_type: action
      description: 在文本编辑区输入标题语法
      action: keyboard_type
      text: '# 标题'
    - step_type: assert
      description: 验证编辑区显示纯文本
      action: assert_element
      selector:
        name: TextEditor
        role: text
    - step_type: assert
      description: 验证OCR识别到# 标题纯文本
      action: assert_ocr_exists
      text: '# 标题'

  - id: v6.6-md-002
    name: 新建文件_实时预览不可用
    module: Markdown渲染
    status: active
    annotation:
      测试界面: 主窗口-右键菜单
      测试功能: 非md文件实时预览菜单项不可选
      前置条件: 文本编辑器已启动；默认新建空白文件（非Markdown）
      AT元素引用: TextEditor
    steps:
    - step_type: action
      description: 新建标签页
      action: keyboard_hot_key
      key: ctrl+t
    - step_type: action
      description: 右键编辑区打开视图模式子菜单
      action: dtk_context_menu
      selector:
        name: TextEditor
        role: text
      menu:
      - View Mode
      - Live Preview
    - step_type: assert
      description: 验证编辑区仍可见（Live Preview未生效）
      action: assert_element
      selector:
        name: TextEditor
        role: text

  - id: v6.6-md-003
    name: 打开md文件_自动识别实时预览
    module: Markdown渲染
    status: active
    annotation:
      测试界面: 主窗口-编辑区/渲染区
      测试功能: 打开md文件后自动进入实时阅览视图
      前置条件: 文本编辑器已启动；系统中存在test.md文件
      AT元素引用: MarkdownView, TextEditor
    steps:
    - step_type: action
      description: 等待md文件加载和实时预览初始化
      action: wait
      wait: 1.0
    - step_type: assert
      description: 验证Markdown渲染视图可见
      action: assert_element
      selector:
        name: MarkdownView
        role: panel
    - step_type: assert
      description: 验证源码编辑区仍可见
      action: assert_element
      selector:
        name: TextEditor
        role: text

  - id: v6.6-md-004
    name: 手动切换语言_激活实时预览
    module: Markdown渲染
    status: active
    annotation:
      测试界面: 主窗口-底栏/编辑区
      测试功能: 手动切换语言为Markdown后实时预览可用
      前置条件: 文本编辑器已启动；默认新建空白文件（非Markdown）
      AT元素引用: HighlightMenu, MarkdownView
    steps:
