  - id: v6.6-md-011
    name: 查看视图_只读模式
    module: Markdown渲染
    status: active
    annotation:
      测试界面: 主窗口-渲染区
      测试功能: 查看视图下编辑区为只读状态
      前置条件: 文本编辑器已打开md文件；当前处于查看视图
      AT元素引用: TextEditor, MarkdownView
    steps:
    - step_type: action
      description: 右键编辑区选择查看视图
      action: dtk_context_menu
      selector:
        name: TextEditor
        role: text
