    status: active
    annotation:
      测试界面: 主窗口-替换栏
      测试功能: 全部替换后总数归零
      前置条件: 文本编辑器已启动；编辑区有多次匹配的文本
      AT元素引用: ReplaceFindInput, ReplaceWithInput, ReplaceAll
    steps:
    - step_type: action
      description: 在文本编辑区输入包含多次出现的文本
      action: keyboard_type
      text: 'hello world hello test hello'
    - step_type: action
      description: 按 Ctrl+H 打开替换栏
      action: keyboard_hot_key
      key: ctrl+h
    - step_type: action
      description: 在替换查找输入框输入查找词
      action: keyboard_type
      text: hello
    - step_type: action
      description: 按 Tab 切换到替换为输入框
      action: keyboard_press
      key: tab
    - step_type: action
      description: 在替换为输入框输入替换词
      action: keyboard_type
      text: hi
    - step_type: action
      description: 点击全部替换按钮
      action: element_action
      selector:
        name: ReplaceAll
