      - "创建临时md文件/tmp/v66_md_test.md并写入# Test Heading"
      - "在文本编辑器中打开该md文件"
      - "点击视图模式菜单"
      - "在视图模式菜单中选择查看视图"
    expected:
      - "编辑器切换到查看视图"
      - "底部视图模式菜单显示查看视图"
