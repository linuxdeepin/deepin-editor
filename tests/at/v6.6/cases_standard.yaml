    steps:
      - "创建临时md文件/tmp/v66_md_test.md并写入# Test Heading"
      - "在文本编辑器中打开该md文件"
      - "在文本编辑区右键"
      - "在右键菜单中选择视图模式子菜单"
      - "在视图模式子菜单中选择编辑模式"
      - "在文本编辑区右键"
      - "在右键菜单中选择视图模式子菜单"
      - "在视图模式子菜单中选择实时预览"
    expected:
      - "编辑器切换到实时阅览视图"
      - "左侧显示源码右侧显示渲染预览"
    manual: false

  - id: "v6.6-md-008"
    title: 【Markdown】底部菜单_切换查看视图
    module: Markdown渲染
    priority: "1"
    precondition:
      - "文本编辑器已打开md文件；当前处于实时阅览视图"
