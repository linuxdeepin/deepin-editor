- id: case_1919211
  name: 查找替换-多匹配项中特定选中状态保留
  module: /V25_2500（测试部专用）/B类解耦商店应用/文本编辑器(#110607)
  description: 查找替换-多匹配项中特定选中状态保留
  status: active
  reason: ''
  steps:
  - step_type: action
    description: 1. 打开文本编辑器，快捷键Ctrl+F触发查找功能
    needs_accessible_name: false
  - step_type: action
    description: 2. 在查找输入框输入文本“武汉”，点击下一个，再次点击下一个
    needs_accessible_name: false
  - step_type: action
    description: 3. 在查找弹窗中，点击右上角的“替换”按钮
    needs_accessible_name: false
  - step_type: action
    description: 4. 观察文本编辑区域的高亮选中状态
    needs_accessible_name: false
  - step_type: assert
    description: 1. 下方显示查找窗口
    needs_accessible_name: false
  - step_type: assert
    description: 2. 第二个“武汉”文本被高亮选中
    needs_accessible_name: false
  - step_type: assert
    description: 3. 替换弹窗的'替换为'输入框自动填充内容与原文本区域高亮选中文本一致
    needs_accessible_name: false
  - step_type: assert
    description: 4. 原文本区域中第二个'武汉'文本保持高亮选中状态
    needs_accessible_name: false
  annotation:
    测试界面: 主窗口-查找/替换浮窗
    测试功能: 多匹配项查找后切换替换并保持高亮选中状态
    前置条件: 应用已启动，编辑区包含多个“武汉”文本
    AT元素引用: 文本编辑器主窗口, 查找, 替换
