- id: case_1919207
  name: 查找替换-替换按钮切换后与Ctrl+H触发功能一致性验证
  module: /V25_2500（测试部专用）/B类解耦商店应用/文本编辑器(#110607)
  description: 查找替换-替换按钮切换后与Ctrl+H触发功能一致性验证
  status: active
  reason: ''
  steps:
  - step_type: action
    description: 1. 使用快捷键Ctrl+F触发查找功能，点击'替换'按钮切换至替换弹窗
    needs_accessible_name: false
  - step_type: action
    description: 2. 关闭当前替换弹窗，使用快捷键Ctrl+H直接触发替换功能
    needs_accessible_name: false
  - step_type: action
    description: 3. 对比步骤1与步骤2的弹窗标题、输入框位置、按钮排列顺序及功能按钮文本
    needs_accessible_name: false
  - step_type: assert
    description: 1. 成功切换至替换弹窗
    needs_accessible_name: false
  - step_type: assert
    description: 2. 弹出替换弹窗
    needs_accessible_name: false
  - step_type: assert
    description: 3. 步骤1与步骤2的弹窗标题、输入框位置、按钮排列顺序及功能按钮文本完全一致
    needs_accessible_name: false
  annotation:
    测试界面: 主窗口-查找/替换浮窗
    测试功能: 查找浮窗替换按钮与 Ctrl+H 替换入口一致性
    前置条件: 应用已启动
    AT元素引用: 文本编辑器主窗口, 查找, 替换
