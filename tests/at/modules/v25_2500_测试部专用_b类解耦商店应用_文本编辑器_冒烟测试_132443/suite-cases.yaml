- id: case_1919203
  name: 查找替换-点击替换按钮切换至替换弹窗（未选中文本）
  module: /V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试(#132443)
  description: 查找替换-点击替换按钮切换至替换弹窗（未选中文本）
  status: active
  reason: ''
  steps:
  - step_type: action
    description: 1. 使用快捷键Ctrl+F触发查找功能
    needs_accessible_name: false
  - step_type: action
    description: 2. 点击查找弹窗中的'替换'按钮
    needs_accessible_name: false
  - step_type: action
    description: 3. 观察当前弹窗标题及布局
    needs_accessible_name: false
  - step_type: assert
    description: 1. 查找弹窗正常显示
    needs_accessible_name: false
  - step_type: assert
    description: 2. 替换弹窗正常显示
    needs_accessible_name: false
