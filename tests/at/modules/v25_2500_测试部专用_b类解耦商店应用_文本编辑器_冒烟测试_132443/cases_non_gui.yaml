- id: case_1704755
  name: 【玲珑】【文本编辑器】仓库玲珑应用信息
  module: /V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试(#132443)
  description: 【玲珑】【文本编辑器】仓库玲珑应用信息
  status: non_gui
  reason: 终端 ll-cli 命令验证，不属于 AT-SPI GUI 自动化用例
  steps:
  - step_type: action
    description: 1. 在终端执行命令：ll-cli search org.deepin.editor
