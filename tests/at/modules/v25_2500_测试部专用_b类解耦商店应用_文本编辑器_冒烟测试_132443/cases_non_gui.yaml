- id: case_1704753
  name: 【玲珑】【文本编辑器】查看玲珑应用信息
  module: /V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试(#132443)
  description: 【玲珑】【文本编辑器】查看玲珑应用信息
