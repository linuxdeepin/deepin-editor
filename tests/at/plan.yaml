  recording_guide: "模块: /V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单(#114347)\n用例数: 35\n\n\
    操作指引 (来自帮助手册):\n# 主菜单\n\n在主菜单中，您可以新建窗口、新建标签页、[查找文本](#查找文本)、[替换文本](#替换文本)、保存文件、切换窗口主题、查看帮助手册，了解文本编辑器的更多信息。\n\
    \n### 设置\n\n您可以对基础信息、快捷键和高级信息进行设置。\n\n#### 基础设置\n\n1. 单击![icon_menu](../common/icon_menu.svg)>\
    \ **设置**。\n2. 在基础设置选项，您可以选择：\n - 设置字体样式和字号大小。\n - 勾选 **自动换行**，在编辑区自动换行。\n - 勾选\
    \ **代码折叠标志**，在左侧栏显示按钮![next](../common/next.svg)或者![next](../common/next_down.svg)，右键单击按钮选择折叠/展开当前层次或所有层次。\n\
    \ - 勾选 **显示行号**，在左侧栏显示行号。\n - 勾选 **当前行高亮**，光标所在的行高亮显示。\n - 勾选 **显示书签图标**，在左侧栏显示书签图标。\n\
    \ - 勾选 **显示空白制符/制表符**，显示文本中的空白字符和制表符，您也可以手动输入或删除空白字符和制表符。\n\n   > ![tips](../common/tips.svg)窍门：在文本编辑器中，使用\
    \ **Ctrl + “+”/ “-”** 调节字号，使用 **Ctrl + 0** 恢复默认字号。\n\n\n\n#### 快捷键设置\n\n1. 单击\
    \ ![icon_menu](../common/icon_menu.svg) > **设置**，在 **快捷键** 选项查看当前快捷键。\n2. 选择一种快捷键映射。\n\
    3. 您可以单击快捷键编辑区域，自定义快捷键。\n\n   > ![notes](../common/notes.svg)说明: 快捷键映射允许您选择某一种键盘快捷键。您可以使用标准快捷键，Emacs快捷键，或自定义快捷键，以符合您的使用习惯。\n\
    \n\n#### 高级设置\n\n1. 单击 ![icon_menu](../common/icon_menu.svg) >**设置**。\n2. 在 **高级设置**\
    \ 选项，您可以设置：\n   - 窗口状态：正常窗口，最大化或全屏。\n   - Tab字符宽度：Tab缩进所占用的空间大小。\n\n\n### 主题\n\
    \n窗口主题包含浅色主题、深色主题和系统主题。\n\n1. 在文本编辑器界面，单击 ![icon_menu](../common/icon_menu.svg)。\n\
    2. 选择 **主题**，选择一个主题颜色。\n\n### 帮助\n\n查看帮助手册，进一步了解和使用文本编辑器。\n\n1. 在文本编辑器界面，单击 ![icon_menu](../common/icon_menu.svg)。\n\
    2. 选择 **帮助**。\n3. 查看文本编辑器的帮助手册。\n\n### 关于\n\n1. 在文本编辑器界面，单击 ![icon_menu](../common/icon_menu.svg)。\n\
    2. 选择 **关于**。\n3. 查看文本编辑器的版本和介绍。\n\n### 退出\n\n1. 在文本编辑器界面，单击 ![icon_menu](../common/icon_menu.svg)。\n\
    2. 选择 **退出**。\n\n录制提示: 打开应用 → 按用例步骤操作 → 每个操作后等待界面稳定 → 完成后按 q 结束"
  status: verified
